apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: dev-root-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:joe6663/gitops-cluster-config.git
    targetRevision: main
    path: clusters/dev/applications

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true