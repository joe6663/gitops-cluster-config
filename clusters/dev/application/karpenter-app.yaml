apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:joe6663/gitops-cluster-config.git
    targetRevision: main
    path: clusters/dev/karpenter

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      selfHeal: true
      prune: true