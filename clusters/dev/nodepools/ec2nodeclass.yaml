apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023

  # Required in Karpenter v1
  amiSelectorTerms:
    - alias: "al2023@latest"

  role: "eks-cluster-dev-karpenter-node"

  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-cluster-dev"

  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-cluster-dev"