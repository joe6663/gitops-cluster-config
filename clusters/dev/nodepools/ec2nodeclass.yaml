apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: "eks-cluster-dev-karpenter-node"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-cluster-dev"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "eks-cluster-dev"