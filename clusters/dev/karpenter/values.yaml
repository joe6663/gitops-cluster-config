serviceAccount:
  create: true
  name: karpenter

settings:
  clusterName: "eks-cluster-dev"
  interruptionQueue: "Karpenter-eks-cluster-dev"

nodeSelector:
  role: system

tolerations:
  - key: dedicated
    operator: Equal
    value: system_pods
    effect: NoSchedule

# Avoid OOMKills and CPU throttling during sudden pod burst events
controller:
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "1Gi"
  logLevel: info
