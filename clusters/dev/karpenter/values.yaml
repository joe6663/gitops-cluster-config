serviceAccount:
  name: karpenter

settings:
  clusterName: "eks-cluster-dev"
  interruptionQueue: "eks-cluster-dev"

nodeSelector:
  role: system

tolerations:
  - key: dedicated
    operator: Equal
    value: system_pods
    effect: NoSchedule

controller:
  resources:
    requests:
      cpu: "1"
      memory: "1Gi"
    limits:
      cpu: "1"
      memory: "1Gi"
  logLevel: info
